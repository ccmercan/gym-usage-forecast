<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f4f5f7">
    <title>Raider Power Zone - TTU Recreation</title>
    <style>
        :root {
            color-scheme: light;
            --red: #c8102e;
            --red-dark: #a50d25;
            --ink: #17202e;
            --muted: #737d8d;
            --line: #e1e5eb;
            --canvas: #f3f5f7;
            --green: #bde7c5;
            --amber: #ffe08a;
            --coral: #f28a8d;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            color: var(--ink);
            background: var(--canvas);
            font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }
        button, input { font: inherit; }
        .container { width: min(100% - 48px, 1540px); margin: 34px auto 56px; }
        .hero {
            min-height: 220px;
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(320px, .82fr);
            overflow: hidden;
            border-radius: 18px;
            background: #fff;
            box-shadow: 0 12px 36px rgba(22, 32, 46, .08);
        }
        .hero-copy { display: flex; align-items: center; gap: 24px; padding: 38px 42px; }
        .ttu-mark { display: block; flex: 0 0 auto; width: 78px; height: 94px; object-fit: contain; }
        .hero-copy-text { min-width: 0; }
        .eyebrow { display: block; color: var(--red); font-size: .72rem; font-weight: 800; letter-spacing: .16em; }
        .hero h1 { margin: 8px 0 0; color: var(--ink); font-size: clamp(2rem, 4vw, 3.25rem); line-height: 1.05; letter-spacing: -.045em; }
        .hero-copy p { margin: 8px 0 0; color: var(--muted); font-size: 1.35rem; }
        .hero-art {
            position: relative;
            min-height: 220px;
            overflow: hidden;
            background: #182330;
        }
        .hero-photo { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center 57%; }
        .hero-photo-shade { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(17,25,35,.08) 0%, rgba(17,25,35,.02) 48%, rgba(12,18,27,.72) 100%); }
        .hero-art-caption { position: absolute; top: 50%; right: 25px; display: flex; flex-direction: column; gap: 8px; padding: 14px 0 14px 18px; border-left: 1px solid rgba(255,255,255,.38); color: #fff; text-align: left; font-size: .72rem; font-weight: 800; letter-spacing: .19em; transform: translateY(-50%); text-shadow: 0 1px 8px rgba(0,0,0,.42); }
        .hero-art-caption i { display: block; width: 36px; height: 3px; margin-top: 4px; background: var(--red); }
        .panel { margin-top: 22px; padding: 28px; border: 1px solid rgba(217,222,229,.72); border-radius: 16px; background: #fff; box-shadow: 0 10px 30px rgba(22,32,46,.055); }
        .panel-heading, .dashboard-heading, .section-heading, .heatmap-heading { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; }
        .panel-heading h2, .dashboard-heading h2 { margin: 0; font-size: 1.58rem; letter-spacing: -.025em; }
        .panel-heading p, .heatmap-heading p, .section-heading p { margin: 3px 0 0; color: var(--muted); }
        .preferences-layout { display: grid; grid-template-columns: minmax(310px, .8fr) minmax(420px, 1.8fr) auto; align-items: center; gap: 28px; margin-top: 26px; }
        .time-preferences { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; padding-right: 26px; border-right: 1px solid var(--line); }
        .form-group { min-width: 0; }
        .form-group label, .interest-preferences legend { display: block; margin-bottom: 9px; color: #354155; font-size: .9rem; font-weight: 700; }
        .time-input-wrap { position: relative; }
        .time-icon { position: absolute; top: 50%; left: 14px; color: #697688; font-size: 1.35rem; transform: translateY(-54%); pointer-events: none; }
        .time-input-wrap input { width: 100%; min-height: 54px; padding: 10px 12px 10px 46px; border: 1px solid #d8dee7; border-radius: 10px; background: #fff; color: var(--ink); font-size: 1.1rem; }
        input:focus-visible, button:focus-visible, .facility-toggle:focus-within { outline: 3px solid rgba(200,16,46,.25); outline-offset: 2px; }
        .interest-preferences { min-width: 0; margin: 0; padding: 0; border: 0; }
        .interest-preferences legend { padding: 0; }
        .facility-toggles { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; }
        .facility-toggle { position: relative; min-height: 48px; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 11px 8px 14px; overflow: hidden; border: 1px solid #dfe4eb; border-radius: 10px; background: #f2f4f7; color: #485468; cursor: pointer; transition: background .18s, border-color .18s, color .18s, transform .18s; }
        .facility-toggle:hover { border-color: #c2c9d2; transform: translateY(-1px); }
        .facility-toggle input { position: absolute; width: 1px; height: 1px; opacity: 0; }
        .facility-toggle:has(input:checked) { border-color: var(--red); background: var(--red); color: #fff; }
        .facility-toggle-name { min-width: 0; font-size: .85rem; font-weight: 650; line-height: 1.2; }
        .toggle-track { flex: 0 0 38px; width: 38px; height: 22px; padding: 3px; border-radius: 20px; background: #d5dbe3; transition: background .18s; }
        .toggle-track span { display: block; width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.18); transition: transform .18s; }
        .facility-toggle:has(input:checked) .toggle-track { background: rgba(255,255,255,.36); }
        .facility-toggle:has(input:checked) .toggle-track span { transform: translateX(16px); }
        .facility-toggle:has(input:focus-visible) { outline: 3px solid rgba(200,16,46,.28); outline-offset: 2px; }
        .field-hint { display: block; margin-top: 10px; color: var(--muted); font-size: .78rem; }
        .save-preferences { align-self: center; padding-left: 4px; }
        button { min-height: 50px; padding: 0 22px; border: 0; border-radius: 9px; background: var(--red); color: #fff; font-weight: 750; white-space: nowrap; cursor: pointer; box-shadow: 0 5px 12px rgba(200,16,46,.16); transition: background .18s, transform .18s; }
        button:hover { background: var(--red-dark); transform: translateY(-1px); }
        .success { align-self: center; padding: 8px 12px; border-radius: 8px; background: #e7f5ea; color: #236a35; font-size: .86rem; font-weight: 700; }
        .dashboard-heading { align-items: end; margin-bottom: 22px; }
        .dashboard-heading .eyebrow { margin-bottom: 4px; }
        .recommendations { padding: 20px; border: 1px solid #ebeff3; border-radius: 12px; background: #fbfcfd; }
        .section-heading h3, .heatmap-heading h3 { margin: 0; font-size: 1.18rem; letter-spacing: -.015em; }
        .section-heading p, .heatmap-heading p { font-size: .91rem; }
        .recommendation-list { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-top: 16px; }
        .recommendation { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 62px; padding: 12px 15px; border: 1px solid #dcefe0; border-left: 4px solid #48a765; border-radius: 9px; background: #f0f8f1; }
        .recommendation-time { color: #255f35; font-size: 1rem; font-weight: 800; }
        .recommendation-usage { color: #52715a; font-size: .85rem; }
        .empty-state { margin: 14px 0 0; color: var(--muted); }
        .heatmap-section { margin-top: 26px; }
        .heatmap-heading { align-items: center; margin-bottom: 18px; }
        .heatmap-legend { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 17px; color: #5f6c7d; font-size: .84rem; }
        .heatmap-legend span { display: inline-flex; align-items: center; gap: 7px; }
        .heatmap-legend small { color: #8a93a0; font-size: .78rem; }
        .legend-dot { width: 18px; height: 18px; display: inline-block; border-radius: 50%; }
        .legend-dot.low { background: var(--green); } .legend-dot.moderate { background: var(--amber); } .legend-dot.high { background: var(--coral); }
        .heatmap-note { margin: 0 0 12px; color: var(--muted); font-size: .82rem; }
        .heatmap-scroll { overflow-x: auto; border: 1px solid var(--line); border-radius: 9px; outline-offset: 3px; }
        .heatmap-table { width: 100%; min-width: 1040px; border-collapse: separate; border-spacing: 1px; background: #e4e8ed; font-size: .83rem; }
        .heatmap-table th, .heatmap-table td { height: 46px; padding: 8px 7px; text-align: center; white-space: nowrap; }
        .heatmap-table thead th { height: 42px; background: #f5f6f8; color: #354155; font-size: .77rem; font-weight: 750; }
        .heatmap-table th:first-child { position: sticky; left: 0; z-index: 1; min-width: 70px; text-align: left; }
        .heatmap-table tbody th { background: #f7f8fa; color: #263246; font-weight: 750; }
        .heatmap-table td { min-width: 47px; color: #253244; font-variant-numeric: tabular-nums; }
        .heat-low { background: var(--green); }
        .heat-moderate { background: var(--amber); }
        .heat-high { background: var(--coral); }
        .heat-empty { background: #f7f8fa; color: #9ba3ad !important; }
        @media (max-width: 1120px) {
            .preferences-layout { grid-template-columns: 1fr; gap: 22px; }
            .time-preferences { padding: 0 0 20px; border-right: 0; border-bottom: 1px solid var(--line); }
            .save-preferences { padding: 0; }
            .save-preferences button { width: 100%; }
        }
        @media (max-width: 760px) {
            .container { width: min(100% - 28px, 1540px); margin: 14px auto 32px; }
            .hero { grid-template-columns: 1fr; }
            .hero-copy { gap: 17px; padding: 25px 21px; }
            .ttu-mark { width: 58px; height: 70px; }
            .hero-art { min-height: 125px; }
            .hero-art-caption { right: 17px; gap: 5px; padding-left: 12px; font-size: .62rem; }
            .panel { margin-top: 14px; padding: 20px 16px; border-radius: 13px; }
            .panel-heading { align-items: flex-start; flex-direction: column; gap: 10px; }
            .panel-heading h2, .dashboard-heading h2 { font-size: 1.35rem; }
            .time-preferences { gap: 12px; }
            .facility-toggles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
            .facility-toggle { min-height: 52px; padding-left: 10px; }
            .facility-toggle-name { font-size: .78rem; }
            .toggle-track { flex-basis: 34px; width: 34px; }
            .facility-toggle:has(input:checked) .toggle-track span { transform: translateX(12px); }
            .dashboard-heading { align-items: flex-start; }
            .recommendations { padding: 16px 13px; }
            .recommendation-list { grid-template-columns: 1fr; gap: 8px; }
            .recommendation { min-height: 52px; }
            .heatmap-heading { align-items: flex-start; flex-direction: column; }
            .heatmap-legend { justify-content: flex-start; gap: 8px 13px; }
        }
        @media (max-width: 420px) {
            .hero-copy { gap: 12px; padding-right: 15px; padding-left: 15px; }
            .ttu-mark { width: 48px; height: 60px; }
            .hero h1 { font-size: 1.8rem; }
            .hero-copy p { font-size: 1.1rem; }
            .time-preferences { grid-template-columns: 1fr; }
            .facility-toggles { grid-template-columns: 1fr; }
            .heatmap-legend span { font-size: .78rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
